<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiDAR point cloud — PDAL denoise &amp; classification — Nurtac Suleymanzade</title>
<style>html,body{margin:0;height:100%;background:#0b1220;font-family:system-ui,sans-serif;overflow:hidden}
#panel{position:absolute;top:12px;left:12px;background:rgba(15,23,42,.9);color:#e2e8f0;padding:14px 16px;border-radius:12px;max-width:330px;font-size:13px;line-height:1.45}
#panel h1{font-size:15px;margin:0 0 6px}a{color:#38bdf8}label{display:block;cursor:pointer}.k{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.164.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.164.1/examples/jsm/"}}</script></head>
<body><div id="panel"><h1>Boulder, CO — USGS 3DEP LiDAR (≈380 × 380 m)</h1><div id="st">Loading points…</div>
<div id="lg"></div><label><input type="checkbox" id="nz"> show removed outliers (red)</label>
<p style="opacity:.75;margin:8px 0 0">Downsampled (0.5 m Poisson + 55 % random) web preview of a 3.6 M-point tile. Drag to orbit, scroll to zoom. Data: <a href="https://www.usgs.gov/3d-elevation-program">USGS 3DEP</a> CO_DRCOG_1_2020 (public domain) via AWS Entwine. <a href="lidar.html">Method &amp; before/after</a> · <a href="index.html">← 3D &amp; Advanced</a></p></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(devicePixelRatio);R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x0b1220);const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,1,5000);cam.position.set(-260,-300,260);cam.up.set(0,0,1);
const ctl=new OrbitControls(cam,R.domElement);ctl.target.set(0,0,10);ctl.update();
const CL={2:['ground',0xb7791f],6:['building',0xf472b6],5:['high vegetation',0x22c55e],1:['other / low',0x9ca3af]};
const [xyz,cls,nz]=await Promise.all(['points_xyz.f32','points_cls.u8','noise_xyz.f32'].map(f=>fetch('lidar/'+f).then(r=>r.arrayBuffer())));
const P=new Float32Array(xyz),K=new Uint8Array(cls),groups={},cnt={};
for(const k in CL){cnt[k]=0}for(let i=0;i<K.length;i++)cnt[K[i]]=(cnt[K[i]]||0)+1;
const lg=document.getElementById('lg');
for(const k in CL){const a=new Float32Array(cnt[k]*3);let j=0;for(let i=0;i<K.length;i++)if(K[i]==k){a[j++]=P[3*i];a[j++]=P[3*i+1];a[j++]=P[3*i+2]}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));const o=new THREE.Points(g,new THREE.PointsMaterial({color:CL[k][1],size:1.1,sizeAttenuation:true}));S.add(o);groups[k]=o;
 const l=document.createElement('label');l.innerHTML=`<input type=checkbox checked> <span class=k style="background:#${CL[k][1].toString(16).padStart(6,'0')}"></span>${CL[k][0]} (${cnt[k].toLocaleString('en')})`;l.firstChild.onchange=e=>o.visible=e.target.checked;lg.appendChild(l)}
const gn=new THREE.BufferGeometry();gn.setAttribute('position',new THREE.BufferAttribute(new Float32Array(nz),3));const N=new THREE.Points(gn,new THREE.PointsMaterial({color:0xef4444,size:1.6}));N.visible=false;S.add(N);
document.getElementById('nz').onchange=e=>N.visible=e.target.checked;
document.getElementById('st').textContent=K.length.toLocaleString('en')+' points in browser (WebGL)';
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
R.setAnimationLoop(()=>R.render(S,cam));
</script></body></html>
